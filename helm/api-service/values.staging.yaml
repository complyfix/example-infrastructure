# Staging overrides for api-service

replicaCount: 1

image:
  tag: "latest"
  pullPolicy: Always

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  - name: APP_ENV
    value: "staging"
  - name: LOG_LEVEL
    value: "debug"
